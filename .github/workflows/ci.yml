name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      # Tests use PGlite (Postgres in memory), so no database service is needed here.
      - name: Tests
        run: pnpm test

      - name: Migrations are up to date with the schema
        run: |
          pnpm db:generate
          git diff --exit-code packages/db/drizzle || (echo "::error::Schema changed but no migration was committed. Run pnpm db:generate and commit the result." && exit 1)
